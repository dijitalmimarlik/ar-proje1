<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Quest 3 AR Projesi</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #e0e0e0; overflow: hidden; }
        model-viewer { 
            width: 100vw; 
            height: 100vh; 
          
        }
    </style>
</head>
<body>

    <model-viewer
        src="model.glb"
        ar
        ar-modes="webxr"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        touch-action: pan-y; >
        
        <button slot="ar-button" style="background-color: white; border-radius: 8px; border: none; position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 15px 20px; font-size: 16px; font-weight: bold; cursor: pointer;">
            AR ile Gerçek Dünyada Gör
        </button>
    </model-viewer>

</body>
</html>
